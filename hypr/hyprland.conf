# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                     Hyprland Config                       ┃
# ┃                 Based on ~/.config/dotfiles               ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# ████████ Variables ████████
$scrPath = $HOME/.local/share/bin
$term = kitty
$editor = neovim
$file = thunar
$browser = google-chrome
$mainMod = Super

# ████████ Monitor ████████
monitor=eDP-1,preferred,auto,1

# ████████ Execute at launch ████████
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $scrPath/polkitkdeauth.sh
exec-once = waybar
exec-once = vicinae server
exec-once = blueman-applet
exec-once = udiskie --no-automount --smart-tray
exec-once = mpvpaper -o "loop-playlist=inf" eDP-1 ~/.config/hypr/bg_video.mp4 

# ████████ Environment ████████
env = PATH,$PATH:$scrPath
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1

# ████████ Input ████████
input {
    kb_layout = us
    follow_mouse = 1

    sensitivity = 0
    force_no_accel = 1
    numlock_by_default = false
}


# ████████ Decoration / Blur ████████
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 5
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        xray = false
        contrast = 0.8
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.0
        noise = 0.0
    }
}

# ████████ General ████████
general {
    gaps_out = 8
    gaps_in = 8
    border_size = 2
    col.active_border = rgba(cba6f7ff)
    col.inactive_border = rgba(6c7086ff)
}

# ████████ Layouts ████████

master {
    new_status = master
}

# ████████ Animations (100ms) ████████
animations {
    enabled = true
    bezier = fast, 0, 0.99, 0.01, 1

animation = windows, 1, 10, fast
    animation = fade, 1, 10, fast
    animation = workspaces, 1, 10, fast
}

# ████████ Misc ████████
misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}

# ████████ Keybindings ████████
source = ~/.config/hypr/keybindings.conf
